name: Build Forge Mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'

      - name: Extract mod project and build
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "No project ZIP found at the repository root."
            exit 1
          fi

          source_dir="$RUNNER_TEMP/astral-echo-source"
          mkdir -p "$source_dir"
          unzip -q "$archive" -d "$source_dir"

          build_file="$(find "$source_dir" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)"
          if [[ -z "$build_file" ]]; then
            echo "The uploaded ZIP does not contain build.gradle or build.gradle.kts."
            exit 1
          fi

          project_dir="$(dirname "$build_file")"
          echo "Building project from: $project_dir"
          gradle -p "$project_dir" build --no-daemon

          mkdir -p build-output
          find "$project_dir/build/libs" -maxdepth 1 -type f -name '*.jar' -exec cp {} build-output/ \;
          if ! compgen -G 'build-output/*.jar' > /dev/null; then
            echo "Gradle succeeded but no JAR was produced."
            exit 1
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: astral-echo-forge-1.20.1
          path: build-output/*.jar
          if-no-files-found: error
